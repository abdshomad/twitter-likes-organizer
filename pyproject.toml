[project]
name = "twitter-likes-organizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abd Shomad", email = "abd.shomad@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.2",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lancedb>=0.37.1",
    "playwright>=1.62.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
twitter-likes-organizer = "twitter_likes_organizer:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
